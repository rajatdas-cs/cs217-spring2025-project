<text x="960.0" y="175.5" font-size="15" fill="#1e1e1e" text-anchor="middle">a pointwise classifier would</text>
<text x="960.0" y="193.8" font-size="15" fill="#1e1e1e" text-anchor="middle">call them all negatives</text>
<text x="70" y="254.2" font-size="15" fill="#1e1e1e" opacity="1.0">BPR fixes this by supervising an ORDER instead of a score: for a sampled unobserved item j,</text>
<text x="70" y="286.2" font-size="15" fill="#1e1e1e" opacity="1.0">maximise sigma(r_ui - r_uj). Only the difference is constrained, so nothing forces j to score low.</text>
